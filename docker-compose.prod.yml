# Production docker-compose — Coolify compatible
# All secrets must be provided as environment variables (never in this file).
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # --- Frontend ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oreoleads-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oreoleads-net
    labels:
      - "com.oreoleads.service=frontend"

  # --- Backend ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oreoleads-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-OreoLeads}
      - Jwt__Audience=${JWT_AUDIENCE:-OreoLeads}
      - Encryption__Key=${ENCRYPTION_KEY}
      - Redis__ConnectionString=redis:6379
      - Brevo__EncryptionKey=${BREVO_ENCRYPTION_KEY}
      - Airtable__EncryptionKey=${AIRTABLE_ENCRYPTION_KEY}
      - Ai__EncryptionKey=${AI_ENCRYPTION_KEY}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_0:-http://localhost:3000}
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend-logs:/app/logs
    networks:
      - oreoleads-net
    labels:
      - "com.oreoleads.service=backend"

  # --- PostgreSQL -------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: oreoleads-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-oreoleads}
      - POSTGRES_USER=${POSTGRES_USER:-oreoleads}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oreoleads} -d ${POSTGRES_DB:-oreoleads}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreoleads-net
    ports:
      - "127.0.0.1:5432:5432"

  # --- Redis ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: oreoleads-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreoleads-net
    ports:
      - "127.0.0.1:6379:6379"

  # --- MinIO ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: oreoleads-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-oreoleads}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oreoleads-net
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # --- RabbitMQ ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: oreoleads-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-oreoleads}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - oreoleads-net
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  rabbitmq-data:
    driver: local
  backend-logs:
    driver: local

networks:
  oreoleads-net:
    driver: bridge
