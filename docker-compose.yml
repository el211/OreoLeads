services:
  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: src/OreoLeads.Api/Dockerfile
    container_name: oreo-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=oreo_leads;Username=oreo;Password=${POSTGRES_PASSWORD:-oreo_password}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
      - Jwt__SecretKey=${JWT_SECRET:-OreoLeads_SuperSecretKey_ChangeInProduction_Min32Chars!}
      - Jwt__Issuer=OreoLeads
      - Jwt__Audience=OreoLeads
      - Jwt__ExpiryMinutes=60
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://frontend
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oreo-network

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oreo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - oreo-network

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: oreo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oreo_leads
      POSTGRES_USER: oreo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oreo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oreo -d oreo_leads"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreo-network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oreo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreo-network

volumes:
  postgres_data:
  redis_data:

networks:
  oreo-network:
    driver: bridge
