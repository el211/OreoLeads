# docker-compose.coolify.yml
# Déploiement Coolify — backend + frontend uniquement.
# PostgreSQL, Redis et RabbitMQ sont fournis par les ressources Coolify existantes.
# Toutes les valeurs sensibles doivent être déclarées comme variables d'environnement dans Coolify.
# Ne jamais écrire de secret dans ce fichier.

services:

  # ── Backend ASP.NET Core ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oreoleads-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # ── Runtime ──────────────────────────────────────────────────────────────
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - AppBaseUrl=https://crm.oreostudios.fr

      # ── Base de données (PostgreSQL Coolify existant) ─────────────────────
      # Format Npgsql : Host=<host>;Port=5432;Database=<db>;Username=<user>;Password=<pass>
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}

      # ── Cache (Redis Coolify existant) ────────────────────────────────────
      # Format StackExchange.Redis : <host>:<port>,password=<pass>,abortConnect=false
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}

      # ── Authentification JWT ──────────────────────────────────────────────
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-OreoLeads}
      - Jwt__Audience=${JWT_AUDIENCE:-OreoLeads}

      # ── Chiffrement AES-256-GCM ───────────────────────────────────────────
      - Encryption__Key=${ENCRYPTION_KEY}

      # ── CORS (URL publique du frontend) ───────────────────────────────────
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS}

      # ── SMTP (boîte mail personnelle — OVH, Namecheap, etc.) ────────────
      # Renseignez ces variables pour envoyer sans Brevo.
      # OVH      : Host=ssl0.ovh.net      Port=465  UseSsl=true
      # Namecheap: Host=mail.privateemail.com Port=465 UseSsl=true
      # Gmail    : Host=smtp.gmail.com    Port=587  UseSsl=false
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-465}
      - Smtp__UseSsl=${SMTP_USE_SSL:-true}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__SenderName=${SMTP_SENDER_NAME:-}
      - Smtp__SenderEmail=${SMTP_SENDER_EMAIL:-}

      # ── Intégrations tierces (optionnelles selon usage) ───────────────────
      - Ai__OpenAiApiKey=${OPENAI_API_KEY:-}
      - Brevo__ApiKey=${BREVO_API_KEY:-}
      - Airtable__AccessToken=${AIRTABLE_TOKEN:-}

      # ── Enrichissement (découverte site/e-mail + Playwright) ──────────────
      - BraveSearch__ApiKey=${BRAVE_SEARCH_API_KEY:-}
      - Enrichment__AutoEnrichOnImport=${ENRICHMENT_AUTO:-true}
      - Enrichment__AutoApplyThreshold=${ENRICHMENT_THRESHOLD:-0.8}
      - Playwright__Enabled=${PLAYWRIGHT_ENABLED:-true}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    volumes:
      - backend-logs:/app/logs
    networks:
      - oreoleads-internal
      - coolify  # must share Coolify's network to reach PostgreSQL/Redis resources by hostname

  # ── Frontend React / Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oreoleads-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oreoleads-internal
      - coolify  # must be on Coolify's network so Traefik can reach it
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      # HTTP → redirect to HTTPS
      - traefik.http.routers.oreoleads-frontend-http.rule=Host(`crm.oreostudios.fr`)
      - traefik.http.routers.oreoleads-frontend-http.entrypoints=http
      - traefik.http.routers.oreoleads-frontend-http.middlewares=oreoleads-https-redirect
      - traefik.http.middlewares.oreoleads-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.oreoleads-https-redirect.redirectscheme.permanent=true
      # HTTPS
      - traefik.http.routers.oreoleads-frontend-https.rule=Host(`crm.oreostudios.fr`)
      - traefik.http.routers.oreoleads-frontend-https.entrypoints=https
      - traefik.http.routers.oreoleads-frontend-https.tls=true
      - traefik.http.routers.oreoleads-frontend-https.tls.certresolver=letsencrypt
      - traefik.http.routers.oreoleads-frontend-https.service=oreoleads-frontend
      # Backend service definition
      - traefik.http.services.oreoleads-frontend.loadbalancer.server.port=80

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  backend-logs:
    driver: local

# ── Réseaux ────────────────────────────────────────────────────────────────
# oreoleads-internal : réseau privé frontend ↔ backend (proxy Nginx).
# coolify            : réseau géré par Coolify, partagé avec les ressources
#                      PostgreSQL et Redis. Le backend doit y être attaché
#                      pour atteindre ces ressources par leur hostname interne.
networks:
  oreoleads-internal:
    driver: bridge
  coolify:
    external: true  # réseau existant créé et géré par Coolify
